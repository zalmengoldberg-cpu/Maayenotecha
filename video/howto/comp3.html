<script>
const META=__META__;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),eo5=x=>1-Math.pow(1-x,5),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const S=[
 {id:'s1',a:0,b:4.4,bg:'L'},{id:'s2',a:4.4,b:7.8,bg:'L'},{id:'s3',a:7.8,b:11.2,bg:'L'},{id:'s4',a:11.2,b:16.0,bg:'D'},
 {id:'s5',a:16.0,b:19.4,bg:'L'},{id:'s6',a:19.4,b:23.0,bg:'L'},{id:'s7',a:23.0,b:26.2,bg:'L'},{id:'s8',a:26.2,b:31.2,bg:'D'},
 {id:'s9',a:31.2,b:34.8,bg:'D'},{id:'s10',a:34.8,b:40.2,bg:'L'},{id:'s11',a:40.2,b:43.4,bg:'L'},{id:'s12',a:43.4,b:48.0,bg:'D'},{id:'s13',a:48.0,b:51.5,bg:'L'}];
const DUR=51.5;window.DUR=DUR;

$$('.cap').forEach(c=>{const ws=c.dataset.cap.split(' ');c.innerHTML=ws.map(w=>{const k=w.startsWith('*');return `<span class="w${k?' k':''}">${w.replace(/\*/g,'').replace(/_/g,' ')}</span>`}).join(' ');c._k=ws.findIndex(w=>w.startsWith('*'))});
function cap(sc,lt,start=0.15,step=0.14){const c=$('.cap',sc);if(!c)return;const ws=$$('.w',c),k=c._k,tk=start+k*step,pe=tk+0.55;
 ws.forEach((w,i)=>{let ti=start+i*step;if(i>k)ti+=0.32;const x=P(lt,ti,ti+0.32);let tr=`translateY(${(1-eo5(x))*40}px)`,op=eo(x),bl=(1-eo(x))*10;
  if(i===k)tr+=` scale(${lerp(2.2,1,eo5(P(lt,tk+0.12,pe)))})`;else if(lt>tk&&lt<pe+0.05&&i<k)op*=lerp(0.28,1,P(lt,pe-0.15,pe+0.05));
  w.style.transform=tr;w.style.opacity=op;w.style.filter=bl>0.3?`blur(${bl}px)`:'none'})}
function shotIn(el,lt,a=0.25,dy=140){const x=eo5(P(lt,a,a+0.65));el.style.transform=`translateY(${(1-x)*dy}px) scale(${0.93+0.07*x})`;el.style.opacity=clamp(x*1.6);return x}
function cursor(el,lt,pts,clicks=[]){if(lt<pts[0][0]){el.style.opacity=0;return}el.style.opacity=P(lt,pts[0][0],pts[0][0]+0.15);
 let x=pts[0][1],y=pts[0][2];for(let i=1;i<pts.length;i++)if(lt>=pts[i-1][0]){const f=eio(P(lt,pts[i-1][0],pts[i][0]));x=lerp(pts[i-1][1],pts[i][1],f);y=lerp(pts[i-1][2],pts[i][2],f)}
 el.style.left=x+'px';el.style.top=y+'px';let sc=1,ring=0;clicks.forEach(c=>{const p=P(lt,c,c+0.4);if(p>0&&p<1)ring=p;const q=P(lt,c-0.06,c+0.12);if(q>0&&q<1)sc=1-0.18*Math.sin(Math.PI*q)});
 el.querySelector('svg').style.transform=`scale(${sc})`;const i=el.querySelector('i');i.style.transform=`scale(${ring?0.3+ring*1.8:0})`;i.style.opacity=ring?1-ring:0}
// position overlay inside shot from crop-space box (css px of capture)
function place(ov,shot,cropW,b,pad=0){const s=shot.offsetWidth/cropW;ov.style.left=(b.x*s-pad)+'px';ov.style.top=(b.y*s-pad)+'px';ov.style.width=(b.w*s+pad*2)+'px';ov.style.height=(b.h*s+pad*2)+'px';return s}
// page coords of a crop-space point (ignores transforms: computed from layout)
function pt(shot,cropW,x,y){const s=shot.offsetWidth/cropW;return [shot.offsetLeft+x*s,shot.offsetTop+y*s]}

// background
const cv=$('#bg'),cx=cv.getContext('2d');const CELL=54,COLS=Math.ceil(1080/CELL),ROWS=Math.ceil(1920/CELL);
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const cells=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)cells.push({c,r,a:rnd(),b:rnd(),ph:rnd()*6.28,tr:rnd()});
function drawBg(t,mode){const L=mode==='L';cx.clearRect(0,0,1080,1920);
 for(const k of cells){const yN=k.r/ROWS;const dens=L?Math.pow(yN,3)*0.5:0.08+Math.pow(yN,2)*0.3;if(k.a<dens){const tw=0.5+0.5*Math.sin(t*1.6+k.ph);const al=(L?0.10+0.16*k.b:0.05+0.16*k.b)*(0.5+0.5*tw);
  cx.fillStyle=L?(k.b>0.8?`rgba(242,145,28,${al*0.8})`:`rgba(255,255,255,${al*2})`):(k.b>0.8?`rgba(242,145,28,${al*1.3})`:`rgba(140,160,235,${al})`);const s=CELL-6;cx.fillRect(k.c*CELL+3,k.r*CELL+3,s,s)}}}
const mist=$('#mist');
function setMode(m,t){if(m==='L'){mist.style.background='linear-gradient(180deg,rgba(243,244,248,.86) 0%,rgba(243,244,248,.45) 26%,rgba(243,244,248,.12) 55%,rgba(243,244,248,.25) 100%)';$('#photo').style.filter='saturate(1.05) blur(1px)'}
 else{mist.style.background='linear-gradient(180deg,rgba(12,15,38,.90) 0%,rgba(15,19,48,.80) 50%,rgba(15,19,48,.88) 100%)';$('#photo').style.filter='saturate(.9) blur(3px)'}
 $('#photo').style.transform=`translateX(-50%) scale(${1.04+0.02*Math.sin(t*0.12)})`}

function upd(id,sc,lt){
 switch(id){
 case 's1':{cap(sc,lt,0.15);const v=$('#view');const x=shotIn(v,lt,0.5);
  // camera push toward the hero (greeting+gauge) region
  const z=eio(P(lt,2.6,4.4));const m=META.view.subs.hero;const s=1000/1440;const cxp=(m.x+m.w/2)*s,cyp=(m.y+m.h/2)*s;
  v.style.transformOrigin=`${cxp}px ${cyp}px`;v.style.transform+=` scale(${1+z*0.55})`;break;}
 case 's2':{cap(sc,lt,0.1);const h=$('#hero');shotIn(h,lt,0.05,80);const cw=META.hero.w;const bb=META.hero.subs.brief;
  const r=$('#briefRing');place(r,h,cw,bb,6);r.style.borderRadius='999px';const g=P(lt,2.55,2.75);r.style.opacity=g*(1-P(lt,3.2,3.4));
  const [bx,by]=pt(h,cw,bb.x+bb.w*0.45,bb.y+bb.h*0.55);cursor($('#cur2'),lt,[[1.4,620,1700],[2.3,bx,by],[3.4,bx,by]],[2.55]);
  h.style.transformOrigin='30% 50%';h.style.transform+=` scale(${1+lt*0.02})`;break;}
 case 's3':{cap(sc,lt,0.1);const b=$('#brief');const x=back(P(lt,0.1,0.7));b.style.transform=`scale(${0.4+0.6*Math.max(0,x)})`;b.style.opacity=clamp(P(lt,0.1,0.35));b.style.transformOrigin='70% 0%';
  const s=860/460;const [nx,ny]=[b.offsetLeft+(540-490)*s,b.offsetTop+(671-170)*s];cursor($('#cur3'),lt,[[1.5,700,1780],[2.3,nx,ny],[3.4,nx,ny]],[2.5]);
  const f=P(lt,2.5,2.9);b.style.transform+=` translateX(${-f*0}px)`;break;}
