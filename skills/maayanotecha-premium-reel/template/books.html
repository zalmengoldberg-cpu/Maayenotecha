<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><title>Maayanotecha – New Books</title>
<link rel="stylesheet" href="brand/brand.css">
<style>
.btitle{position:absolute;left:60px;right:60px;top:1300px;text-align:center}
.bauth{position:absolute;left:60px;right:60px;top:1420px;text-align:center}
.bline{position:absolute;left:90px;right:90px;top:1490px;text-align:center}
.intro{position:absolute;left:0;right:0;top:300px;text-align:center}
.count{position:absolute;left:0;right:0;top:1640px;text-align:center;direction:ltr;font-family:Dig,Say;font-size:40px;color:#8e93a3;letter-spacing:.1em}
</style></head>
<body><div id="stage"></div>
<script src="brand/brand.js"></script>
<script src="brand/hooks.js"></script>
<script>
/* CONFIG (format: "books")
 { eyebrow, newTag, title, books:[{c,t,a,line}], perBook, lineupText, bug:'yarid'|'logo'|null,
   end:{tag,cta,url}, variant:{background:'stage'|'ribbon'|'glow', accentHue, accent1, accent2, enterFrom:'left'|'below'} } */
const B = CFG.books || [{c:'tvbnvt-tny',t:'תובנות התניא',a:'הרב אריק מלכיאלי',line:'50 תובנות מספר היסוד של החסידות'},{c:'svgyvt-yswd-a',t:'סוגיות יסוד א׳',a:'הרב מנחם ברוד'}];
const V = CFG.variant || {}, S = CFG.perBook || 2.4, INTRO = 2.3, tL = INTRO + B.length*S, tEnd = tL + 2.4;
window.DURATION = tEnd + 3.4;

makeBackground(V.background||'stage');
const vx = makeVortex(B.map(b=>b.c).concat(CFG.extraCovers||[]), 26);
const intro = el('div','intro');
const eb = el('div','eyebrow',CFG.eyebrow||'מעיינותיך',intro);
const nt = el('div','h-xl acc',CFG.newTag||'חדש!',intro); nt.style.marginTop='14px';
const ttl = el('div','h-l',null,intro); const ttlW = words(ttl, CFG.title||'על המדף');
const bug = makeBug(CFG.bug);
const books = B.map(b=>makeBook(b.c,560));
const T = B.map(b=>{ const g=el('div','');
  const t=el('div','btitle h-m',null,g); const tw=words(t,b.t);
  const a=el('div','bauth eyebrow',b.a||'',g); const l=el('div','bline sub',null,g); const lw=b.line?words(l,b.line,''):[];
  return {g,tw,a,lw}; });
const cnt = el('div','count');
const lineup = B.map(b=>makeBook(b.c,300));
const lt = el('div','center h-m'); lt.style.top='1330px'; const ltW = words(lt, CFG.lineupText||'עכשיו בחנות');
const EN = makeEnd(); const flash = el('div','flash'); el('div','grain');
applyVariant();

function render(t){
  renderBackground(t); renderGloss(t);
  // intro
  const inOn = t<INTRO+0.2; intro.style.display=inOn?'block':'none';
  if(inOn){ const k=E.out5(P(t,0.05,0.35)), ko=E.in3(P(t,INTRO-0.25,INTRO));
    op(eb,k*(1-ko)); nt.style.transform=`scale(${lerp(1.6,1,E.back(P(t,0,0.45)))*(1+ko*0.4)})`; op(nt,P(t,0,0.15)*(1-ko));
    revealWords(ttlW,t,0.35,0.1,0.35,INTRO-0.25); }
  renderVortex(vx,t,0.0,INTRO-0.55,INTRO);
  op(flash, Math.max(0,1-Math.abs(t-(INTRO-0.2))/0.18)*0.6);
  if(bug){ op(bug, t>0.2&&t<tEnd ? E.out3(P(t,0.2,0.5)) : 0); }
  // books, one by one
  B.forEach((b,i)=>{ const a=INTRO+i*S, z=a+S, on=t>=a-0.05&&t<z+0.05, img=books[i];
    T[i].g.style.display=on?'block':'none';
    if(!on){ op(img,0); return; }
    const kin=E.expo(P(t,a,a+0.55)), kout=E.inexpo(P(t,z-0.35,z));
    const fromBelow=V.enterFrom==='below';
    const x = 540 + (fromBelow?0:-(1-kin)*900) + kout*900, y = 820 + (fromBelow?(1-kin)*900:0) - kout*40;
    placeBook(img,x,y,{s:lerp(0.7,1,kin)*(1-kout*0.3), ry:(1-kin)*-35 + Math.sin(t*1.3)*6 + kout*35, rz:(1-kin)*-8, o:Math.min(1,kin*2)*(1-kout), bob:8, t});
    revealWords(T[i].tw,t,a+0.3,0.08,0.35,z-0.3);
    const ka=E.out5(P(t,a+0.55,a+0.9))*(1-E.in3(P(t,z-0.3,z))); op(T[i].a,ka); T[i].a.style.transform=`translateY(${(1-ka)*20}px)`;
    revealWords(T[i].lw,t,a+0.75,0.05,0.3,z-0.3);
    cnt.textContent = `${String(i+1).padStart(2,'0')} / ${String(B.length).padStart(2,'0')}`;
  });
  op(cnt, t>INTRO&&t<tL ? 1 : 0);
  // lineup
  const lOn=t>=tL-0.05&&t<tEnd+0.1; lt.style.display=lOn?'block':'none';
  lineup.forEach((img,i)=>{ if(!lOn){op(img,0);return;} const n=B.length, f=n>1?i/(n-1)-0.5:0, k=E.back(P(t,tL+i*0.07,tL+0.5+i*0.07)), ko=E.in3(P(t,tEnd-0.25,tEnd));
    placeBook(img, 540+f*Math.min(760,n*190), 860+Math.abs(f)*120*(1-ko) + (1-k)*400, {s:lerp(.5,1,k)*(1-ko*0.4), rz:f*16, ry:-f*20, o:clamp(k*1.5)*(1-ko), bob:6, t:t+i}); });
  if(lOn) revealWords(ltW,t,tL+0.4,0.09,0.35,tEnd-0.25);
  renderEnd(EN,t,tEnd);
}
window.render = withHook(render);
window.ready = brandReady();
</script></body></html>
