<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>מעינותיך – חנות ספרים</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700;900&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --gold:#b8922a;--gold-l:#d4af5a;--gold-pale:#fdf5e0;
  --navy:#1b2e5e;--navy-l:#2a4380;--navy-d:#111e3d;
  --teal:#2e7d8a;--purple:#5b3a8a;
  --bg:#f7f4ee;--card:#fff;
  --text:#1a1a1a;--muted:#6b5f52;--border:#e8e0d0;
  --r:14px;--shadow:0 2px 16px rgba(0,0,0,.09);
  --shadow-h:0 8px 32px rgba(0,0,0,.16);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Heebo',Arial,sans-serif;background:var(--bg);color:var(--text);direction:rtl;min-height:100vh}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit}

/* ── HEADER ─────────────────────────────────── */
.site-header{
  position:sticky;top:0;z-index:200;
  background:rgba(27,46,94,.97);backdrop-filter:blur(10px);
  border-bottom:2px solid rgba(212,175,90,.3);
}
.header-inner{
  max-width:1300px;margin:0 auto;
  display:flex;align-items:center;gap:16px;
  padding:0 24px;height:68px;
}
.logo{display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo-mark{
  width:40px;height:40px;background:var(--gold);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.logo-text{font-family:'Frank Ruhl Libre',serif;font-size:1.35rem;font-weight:700;color:#fff}
.logo-sub{font-size:.7rem;color:rgba(255,255,255,.55);margin-top:1px}

.search-wrap{flex:1;max-width:440px;position:relative}
.search-wrap input{
  width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:#fff;border-radius:30px;padding:9px 42px 9px 16px;font-size:.9rem;
  font-family:inherit;outline:none;transition:all .2s;
}
.search-wrap input::placeholder{color:rgba(255,255,255,.45)}
.search-wrap input:focus{background:rgba(255,255,255,.18);border-color:var(--gold-l)}
.search-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:rgba(255,255,255,.45);pointer-events:none;font-size:1rem;
}

.cart-btn{
  display:flex;align-items:center;gap:7px;
  background:var(--gold);color:#fff;border:none;
  border-radius:30px;padding:8px 18px;font-size:.85rem;font-weight:600;
  transition:opacity .2s;position:relative;white-space:nowrap;
}
.cart-btn:hover{opacity:.88}
.cart-count{
  background:#fff;color:var(--gold);border-radius:50%;
  width:19px;height:19px;font-size:.72rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s;
}
.cart-count.bump{transform:scale(1.5)}

/* ── HERO ───────────────────────────────────── */
.hero{
  background:linear-gradient(150deg,var(--navy-d) 0%,var(--navy) 50%,var(--teal) 100%);
  padding:72px 24px 60px;text-align:center;position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 50% at 50% 100%,rgba(184,146,42,.18),transparent);
}
.hero-logo{display:inline-block;margin-bottom:28px}
.hero-svg{filter:drop-shadow(0 4px 16px rgba(0,0,0,.3))}
.hero h1{
  font-family:'Frank Ruhl Libre',serif;font-size:clamp(1.8rem,5vw,3rem);
  font-weight:900;color:#fff;line-height:1.2;margin-bottom:14px;
  text-shadow:0 2px 12px rgba(0,0,0,.4);
}
.hero p{color:rgba(255,255,255,.78);font-size:1.05rem;max-width:540px;margin:0 auto 32px;line-height:1.7}
.hero-stats{display:flex;justify-content:center;gap:32px;flex-wrap:wrap}
.stat{text-align:center}
.stat-num{font-family:'Frank Ruhl Libre',serif;font-size:1.7rem;font-weight:700;color:var(--gold-l)}
.stat-label{font-size:.8rem;color:rgba(255,255,255,.6);margin-top:2px}

/* ── FILTERS BAR ────────────────────────────── */
.filters-bar{
  background:#fff;border-bottom:1px solid var(--border);
  padding:0;position:sticky;top:68px;z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}
.filters-inner{
  max-width:1300px;margin:0 auto;
  display:flex;align-items:center;gap:0;
  padding:0 16px;overflow-x:auto;
  scrollbar-width:none;
}
.filters-inner::-webkit-scrollbar{display:none}
.filter-btn{
  flex-shrink:0;border:none;background:none;
  color:var(--muted);font-size:.88rem;font-weight:500;
  padding:15px 16px;border-bottom:3px solid transparent;
  transition:all .18s;white-space:nowrap;
}
.filter-btn:hover{color:var(--navy)}
.filter-btn.active{color:var(--navy);border-bottom-color:var(--gold);font-weight:700}

.sort-wrap{
  margin-right:auto;display:flex;align-items:center;gap:8px;
  padding:8px 0 8px 16px;flex-shrink:0;
}
.sort-wrap select{
  border:1px solid var(--border);background:#fff;color:var(--text);
  padding:6px 12px;border-radius:8px;font-size:.82rem;font-family:inherit;
  outline:none;cursor:pointer;direction:rtl;
}

/* ── MAIN ────────────────────────────────────── */
.main{max-width:1300px;margin:0 auto;padding:36px 24px 80px}

.results-info{
  font-size:.88rem;color:var(--muted);margin-bottom:20px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
.results-info strong{color:var(--navy)}

/* ── GRID ─────────────────────────────────── */
.books-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:24px;
}

/* ── CARD ─────────────────────────────────── */
.book-card{
  background:var(--card);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column;
  transition:transform .22s,box-shadow .22s;cursor:pointer;
  border:1px solid transparent;
}
.book-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-h);border-color:var(--gold-pale)}

.card-img{height:240px;overflow:hidden;background:var(--border);position:relative;flex-shrink:0}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.book-card:hover .card-img img{transform:scale(1.05)}
.card-img .ph{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(155deg,var(--navy) 0%,var(--purple) 100%);
  color:#fff;font-family:'Frank Ruhl Libre',serif;font-size:1rem;
  text-align:center;padding:20px;line-height:1.5;
}
.card-badge{
  position:absolute;top:10px;right:10px;
  background:var(--gold);color:#fff;
  font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:20px;
}
.card-new{background:var(--teal)}

.card-body{padding:18px 20px;display:flex;flex-direction:column;flex:1}
.card-series{
  font-size:.68rem;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:var(--teal);margin-bottom:5px;
}
.card-title{
  font-family:'Frank Ruhl Libre',serif;font-size:1.18rem;font-weight:700;
  color:var(--navy);line-height:1.35;margin-bottom:5px;
}
.card-author{font-size:.82rem;color:var(--muted);margin-bottom:10px}
.card-desc{font-size:.84rem;color:var(--muted);line-height:1.65;flex:1;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  margin-bottom:16px;
}
.card-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}
.card-price{font-size:1.1rem;font-weight:700;color:var(--navy)}
.card-price span{font-size:.75rem;font-weight:400;color:var(--muted)}
.btn-buy{
  background:linear-gradient(135deg,var(--gold),var(--gold-l));
  color:#fff;border:none;border-radius:30px;
  padding:8px 20px;font-size:.84rem;font-weight:700;
  transition:opacity .18s,transform .15s;white-space:nowrap;
}
.btn-buy:hover{opacity:.88;transform:scale(1.03)}
.btn-cart{
  width:36px;height:36px;border-radius:50%;border:2px solid var(--border);
  background:#fff;color:var(--muted);font-size:1rem;
  display:flex;align-items:center;justify-content:center;
  transition:all .18s;
}
.btn-cart:hover{border-color:var(--gold);color:var(--gold)}
.btn-cart.added{background:var(--gold);border-color:var(--gold);color:#fff}

/* ── EMPTY STATE ─────────────────────────── */
.empty{
  grid-column:1/-1;text-align:center;padding:64px 24px;
  color:var(--muted);
}
.empty-icon{font-size:3rem;margin-bottom:12px;opacity:.4}

/* ── MODAL ───────────────────────────────── */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;
  display:flex;align-items:center;justify-content:center;padding:16px;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.overlay.show{opacity:1;pointer-events:all}
.modal{
  background:#fff;border-radius:20px;max-width:780px;width:100%;
  max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.3);
  transform:translateY(20px);transition:transform .25s;direction:rtl;
}
.overlay.show .modal{transform:translateY(0)}
.modal-grid{display:grid;grid-template-columns:280px 1fr}
.modal-img{height:100%;min-height:360px;position:sticky;top:0}
.modal-img img{width:100%;height:100%;object-fit:cover;border-radius:20px 0 0 20px}
.modal-img .ph{height:360px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(155deg,var(--navy),var(--purple));
  color:#fff;font-family:'Frank Ruhl Libre',serif;font-size:1rem;text-align:center;padding:20px;
  border-radius:20px 0 0 20px;}
.modal-body{padding:32px 28px 32px 20px}
.modal-close{
  position:absolute;top:14px;left:14px;width:34px;height:34px;
  background:rgba(0,0,0,.12);border:none;border-radius:50%;
  color:#fff;font-size:1.1rem;display:flex;align-items:center;justify-content:center;
  transition:background .18s;
}
.modal-close:hover{background:rgba(0,0,0,.28)}
.modal .overlay-close-btn{position:sticky;top:12px;float:left;
  margin-bottom:-34px;position:relative;z-index:5;
}
.modal-series{font-size:.72rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--teal);margin-bottom:8px}
.modal-title{font-family:'Frank Ruhl Libre',serif;font-size:1.6rem;font-weight:900;color:var(--navy);line-height:1.25;margin-bottom:8px}
.modal-author{font-size:.9rem;color:var(--muted);margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.modal-desc{font-size:.92rem;color:var(--text);line-height:1.8;margin-bottom:24px}
.modal-meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.meta-chip{background:var(--gold-pale);color:var(--navy);border-radius:20px;padding:5px 14px;font-size:.8rem;font-weight:600}
.modal-footer{display:flex;align-items:center;gap:14px}
.modal-price{font-family:'Frank Ruhl Libre',serif;font-size:1.8rem;font-weight:700;color:var(--navy)}
.btn-buy-lg{
  flex:1;background:linear-gradient(135deg,var(--gold),var(--gold-l));
  color:#fff;border:none;border-radius:30px;padding:13px 24px;
  font-size:.95rem;font-weight:700;transition:opacity .18s;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-buy-lg:hover{opacity:.88}

/* ── CART DRAWER ─────────────────────────── */
.cart-drawer{
  position:fixed;top:0;left:0;bottom:0;width:340px;
  background:#fff;z-index:400;box-shadow:-8px 0 32px rgba(0,0,0,.15);
  display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform .3s;direction:rtl;
}
.cart-drawer.open{transform:translateX(0)}
.cart-head{
  padding:20px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.cart-head h2{font-family:'Frank Ruhl Libre',serif;font-size:1.2rem;color:var(--navy)}
.cart-close{background:none;border:none;font-size:1.4rem;color:var(--muted);line-height:1}
.cart-items{flex:1;overflow-y:auto;padding:12px}
.cart-empty{text-align:center;padding:40px 20px;color:var(--muted)}
.cart-item{display:flex;gap:12px;padding:12px 8px;border-bottom:1px solid var(--border);align-items:center}
.cart-item-img{width:52px;height:68px;object-fit:cover;border-radius:6px;background:var(--border);flex-shrink:0}
.cart-item-info{flex:1;min-width:0}
.cart-item-title{font-size:.85rem;font-weight:600;color:var(--navy);line-height:1.3;margin-bottom:3px}
.cart-item-price{font-size:.82rem;color:var(--gold);font-weight:700}
.cart-item-remove{background:none;border:none;color:var(--muted);font-size:.9rem;padding:4px;transition:color .18s}
.cart-item-remove:hover{color:#e53935}
.cart-foot{padding:16px 16px;border-top:1px solid var(--border)}
.cart-total{display:flex;justify-content:space-between;margin-bottom:14px;font-weight:700;color:var(--navy)}
.btn-checkout{
  width:100%;background:linear-gradient(135deg,var(--gold),var(--gold-l));
  color:#fff;border:none;border-radius:30px;padding:13px;
  font-size:.9rem;font-weight:700;
}
.btn-checkout:hover{opacity:.88}

/* ── TOAST ─────────────────────────────── */
.toast{
  position:fixed;bottom:28px;right:28px;z-index:500;
  background:var(--navy);color:#fff;border-radius:10px;
  padding:12px 20px;font-size:.88rem;font-weight:500;
  box-shadow:0 6px 24px rgba(0,0,0,.25);
  transform:translateY(16px);opacity:0;
  transition:all .25s;pointer-events:none;
  display:flex;align-items:center;gap:10px;
}
.toast.show{transform:translateY(0);opacity:1}
.toast-icon{font-size:1.1rem}

/* ── BACK TO TOP ─────────────────────────── */
.back-top{
  position:fixed;bottom:28px;left:28px;z-index:500;
  width:44px;height:44px;border-radius:50%;
  background:var(--navy);color:#fff;border:none;
  font-size:1.2rem;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,.2);
  opacity:0;transform:translateY(12px);
  transition:all .25s;pointer-events:none;
}
.back-top.visible{opacity:1;transform:translateY(0);pointer-events:all}
.back-top:hover{background:var(--navy-l)}

/* ── FOOTER ─────────────────────────────── */
footer{background:var(--navy-d);color:rgba(255,255,255,.65);text-align:center;padding:40px 24px}
footer .f-logo{font-family:'Frank Ruhl Libre',serif;font-size:1.5rem;font-weight:700;color:#fff;margin-bottom:8px}
footer a{color:var(--gold-l)}
footer p{margin-bottom:6px;font-size:.88rem}
.f-links{display:flex;justify-content:center;gap:20px;margin:16px 0;flex-wrap:wrap}
.f-links a{font-size:.85rem;color:rgba(255,255,255,.55);transition:color .18s}
.f-links a:hover{color:#fff}

/* ── RESPONSIVE ─────────────────────────── */
@media(max-width:900px){
  .modal-grid{grid-template-columns:1fr}
  .modal-img{display:none}
  .modal-img.mobile{display:block;height:220px;position:relative}
  .modal-img.mobile img{border-radius:20px 20px 0 0}
  .modal-img.mobile .ph{height:220px;border-radius:20px 20px 0 0}
}
@media(max-width:680px){
  .header-inner{padding:0 12px;gap:8px}
  .logo-sub{display:none}
  .cart-btn span{display:none}
  .hero{padding:48px 16px 40px}
  .books-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .main{padding:24px 12px 60px}
}
@media(max-width:480px){
  .books-grid{grid-template-columns:1fr 1fr}
  .card-img{height:180px}
  .card-body{padding:12px 14px}
  .card-title{font-size:1rem}
  .hero-stats{gap:16px}
}
@media(max-width:340px){
  .books-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="header-inner">
    <div class="logo" onclick="filterBy('all');scrollTo(0,0)">
      <div class="logo-mark">✦</div>
      <div>
        <div class="logo-text">מעינותיך</div>
        <div class="logo-sub">ספרי קודש וחסידות</div>
      </div>
    </div>
    <div class="search-wrap">
      <span class="search-icon">&#x2315;</span>
      <input type="text" id="searchInput" placeholder="חפש ספר, מחבר..." oninput="renderBooks()"/>
    </div>
    <button class="cart-btn" onclick="toggleCart()">
      <span>🛒</span><span>עגלה</span>
      <div class="cart-count" id="cartCount">0</div>
    </button>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-logo">
    <svg class="hero-svg" width="90" height="66" viewBox="0 0 90 66" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="45" cy="62" rx="24" ry="7" fill="#2e7d8a" opacity=".2"/>
      <line x1="45" y1="60" x2="45" y2="38" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity=".5"/>
      <ellipse cx="25" cy="18" rx="11" ry="17" fill="#1b2e5e" transform="rotate(-18 25 18)"/>
      <ellipse cx="45" cy="10" rx="11" ry="17" fill="#5b3a8a"/>
      <ellipse cx="65" cy="18" rx="11" ry="17" fill="#2e7d8a" transform="rotate(18 65 18)"/>
      <ellipse cx="14" cy="32" rx="8" ry="13" fill="#1b2e5e" transform="rotate(-42 14 32)"/>
      <ellipse cx="76" cy="32" rx="8" ry="13" fill="#2e7d8a" transform="rotate(42 76 32)"/>
      <circle cx="45" cy="39" r="5" fill="#d4af5a"/>
    </svg>
  </div>
  <h1>מעינותיך<br/><span style="font-weight:300;font-size:.75em">קטלוג ספרים תשפ"ב</span></h1>
  <p>אוסף ספרים נבחרים בחסידות, תפילה ומחשבה יהודית — לכל רמה ולכל גיל</p>
  <div class="hero-stats">
    <div class="stat"><div class="stat-num" id="totalCount">0</div><div class="stat-label">ספרים</div></div>
    <div class="stat"><div class="stat-num">5+</div><div class="stat-label">קטגוריות</div></div>
    <div class="stat"><div class="stat-num">שנתי</div><div class="stat-label">קטלוג</div></div>
  </div>
</section>

<!-- FILTERS -->
<div class="filters-bar">
  <div class="filters-inner" id="filtersBar">
    <button class="filter-btn active" data-cat="all" onclick="filterBy('all')">הכל</button>
    <button class="filter-btn" data-cat="chassidus" onclick="filterBy('chassidus')">חסידות</button>
    <button class="filter-btn" data-cat="tefila" onclick="filterBy('tefila')">תפילה</button>
    <button class="filter-btn" data-cat="moadim" onclick="filterBy('moadim')">מועדים</button>
    <button class="filter-btn" data-cat="rashab" onclick="filterBy('rashab')">אדמו"ר הרש"ב</button>
    <button class="filter-btn" data-cat="shave" onclick="filterBy('shave')">שווה לכל נפש</button>
    <button class="filter-btn" data-cat="jacobson" onclick="filterBy('jacobson')">הרב ג'ייקובסון</button>
    <div class="sort-wrap">
      <select id="sortSelect" onchange="renderBooks()">
        <option value="default">מיון</option>
        <option value="price-asc">מחיר: נמוך לגבוה</option>
        <option value="price-desc">מחיר: גבוה לנמוך</option>
        <option value="title">לפי שם</option>
      </select>
    </div>
  </div>
</div>

<!-- MAIN -->
<main class="main">
  <div class="results-info">
    <span id="resultsText"></span>
  </div>
  <div class="books-grid" id="booksGrid"></div>
</main>

<!-- FOOTER -->
<footer>
  <div class="f-logo">מעינותיך</div>
  <p>קטלוג ספרי קודש וחסידות | תשפ"ב</p>
  <div class="f-links">
    <a href="https://www.sifreiorhachaim.co.il" target="_blank">ספרי אור החיים</a>
    <a href="https://www.sifreiorhachaim.co.il/product-category/%D7%97%D7%91%D7%93/" target="_blank">כל ספרי חב"ד</a>
  </div>
  <p style="font-size:.8rem;opacity:.5">כל הזכויות שמורות © מעינותיך</p>
</footer>

<!-- MODAL -->
<div class="overlay" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modalBox">
    <div class="modal-grid" id="modalGrid">
      <div class="modal-img" id="modalImg"></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
</div>

<!-- CART DRAWER -->
<div class="cart-drawer" id="cartDrawer">

  });

  if(sort==='price-asc') books.sort((a,b)=>a.price-b.price);
  else if(sort==='price-desc') books.sort((a,b)=>b.price-a.price);
  else if(sort==='title') books.sort((a,b)=>a.title.localeCompare(b.title,'he'));

  return books;
}

function renderBooks(){
  const books = getFiltered();
  const grid = document.getElementById('booksGrid');
  const info = document.getElementById('resultsText');

  info.innerHTML = `מציג <strong>${books.length}</strong> ספרים`;

  if(!books.length){
    grid.innerHTML = `<div class="empty"><div class="empty-icon">📚</div><p>לא נמצאו ספרים התואמים את החיפוש</p></div>`;
    return;
  }

  grid.innerHTML = books.map(b => {
    const inCart = cart.some(c=>c.id===b.id);
    return `
    <article class="book-card" onclick="openModal(${b.id})">
      <div class="card-img">
        <img src="${b.img}" alt="${b.title}" loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
        <div class="ph" style="display:none">${b.title}</div>
        ${b.badge?`<span class="card-badge ${b.badge==='חדש'?'card-new':''}">${b.badge}</span>`:''}
      </div>
      <div class="card-body">
        <div class="card-series">${b.series}</div>
        <h2 class="card-title">${b.title}</h2>
        <p class="card-author">${b.author}</p>
        <p class="card-desc">${b.desc}</p>
        <div class="card-footer">
          <div class="card-price">₪${b.price}<span> כולל מע"מ</span></div>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn-cart ${inCart?'added':''}" title="הוסף לעגלה"
              onclick="event.stopPropagation();toggleCart_(${b.id},this)">
              ${inCart?'✓':'🛒'}
            </button>
            <a class="btn-buy" href="${b.url}" target="_blank"
              onclick="event.stopPropagation()">לרכישה ←</a>
          </div>
        </div>
      </div>
    </article>`;
  }).join('');
}

function filterBy(cat){
  currentCat = cat;
  document.querySelectorAll('.filter-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.cat===cat);
  });
  renderBooks();
  document.querySelector('.main').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ══════════════════════════════════════════════
   MODAL
══════════════════════════════════════════════ */
function openModal(id){
  const b = BOOKS.find(x=>x.id===id);
  if(!b) return;
  const inCart = cart.some(c=>c.id===b.id);

  document.getElementById('modalImg').innerHTML = `
    <img src="${b.img}" alt="${b.title}"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
    <div class="ph" style="display:none">${b.title}</div>`;

  document.getElementById('modalBody').innerHTML = `
    <button style="float:left;background:none;border:none;font-size:1.5rem;color:var(--muted);cursor:pointer;margin-bottom:8px"
      onclick="closeModal()">✕</button>
    <div class="modal-series">${b.series}</div>
    <h2 class="modal-title">${b.title}</h2>
    <p class="modal-author">${b.author}</p>
    <p class="modal-desc">${b.desc}</p>
    <div class="modal-meta">
      ${(b.tags||[]).map(t=>`<span class="meta-chip">${t}</span>`).join('')}
    </div>
    <div class="modal-footer">
      <div class="modal-price">₪${b.price}</div>
      <button class="btn-cart ${inCart?'added':''}" style="width:42px;height:42px;flex-shrink:0"
        title="הוסף לעגלה" onclick="toggleCart_(${b.id},this)">${inCart?'✓':'🛒'}</button>
      <a class="btn-buy-lg" href="${b.url}" target="_blank">
        <span>לרכישה באתר</span><span>←</span>
      </a>
    </div>`;

  document.getElementById('modal').classList.add('show');
  document.body.style.overflow='hidden';
}

function closeModal(e){
  if(e && e.target!==document.getElementById('modal')) return;
  document.getElementById('modal').classList.remove('show');
  document.body.style.overflow='';
}

document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* ══════════════════════════════════════════════
   CART
══════════════════════════════════════════════ */
function toggleCart_(id, btn){
  const b = BOOKS.find(x=>x.id===id);
  const idx = cart.findIndex(c=>c.id===id);
  if(idx===-1){
    cart.push(b);
    if(btn){ btn.classList.add('added'); btn.textContent='✓'; }
    showToast(`"${b.title}" נוסף לעגלה ✓`);
  } else {
    cart.splice(idx,1);
    if(btn){ btn.classList.remove('added'); btn.textContent='🛒'; }
  }
  updateCartUI();
}

function updateCartUI(){
  const cnt = document.getElementById('cartCount');
  cnt.textContent = cart.length;
  cnt.classList.add('bump');
  setTimeout(()=>cnt.classList.remove('bump'),250);

  const items = document.getElementById('cartItems');
  const foot = document.getElementById('cartFoot');

  if(!cart.length){
    items.innerHTML = '<div class="cart-empty"><p style="font-size:2rem">🛒</p><p>העגלה ריקה</p></div>';
    foot.innerHTML = '';
    return;
  }

  items.innerHTML = cart.map(b=>`
    <div class="cart-item">
      <img class="cart-item-img" src="${b.img}" alt="${b.title}"
        onerror="this.style.opacity=.3"/>
      <div class="cart-item-info">
        <div class="cart-item-title">${b.title}</div>
        <div class="cart-item-price">₪${b.price}</div>
      </div>
      <button class="cart-item-remove" onclick="toggleCart_(${b.id},null);updateGrid()"
        title="הסר">✕</button>
    </div>`).join('');

  const total = cart.reduce((s,b)=>s+b.price,0);
  foot.innerHTML = `
    <div class="cart-total"><span>סה"כ:</span><span>₪${total}</span></div>
    <a class="btn-checkout" href="https://www.sifreiorhachaim.co.il" target="_blank"
      onclick="toggleCart()">עבור לאתר הרכישה ←</a>`;
}

function updateGrid(){ renderBooks(); }

function toggleCart(){
  document.getElementById('cartDrawer').classList.toggle('open');
}

/* ══════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════ */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'),2800);
}

/* ══════════════════════════════════════════════
   BACK TO TOP
══════════════════════════════════════════════ */
window.addEventListener('scroll',()=>{
  document.getElementById('backTop').classList.toggle('visible', scrollY>400);
});

/* ══════════════════════════════════════════════
   INIT
══════════════════════════════════════════════ */
document.getElementById('totalCount').textContent = BOOKS.length;
renderBooks();
updateCartUI();
</script>
</body>
</html>
